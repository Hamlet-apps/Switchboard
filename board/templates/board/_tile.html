{% if tile.img %}<img class="tile logo {{ size }}" src="{{ tile.img }}" alt="{{ tile.label }}"{% if tile.label %} title="{{ tile.label }}"{% endif %}>{% else %}<span class="tile {{ size }}"{% if tile.bg %} style="background: {{ tile.bg }}; color: {{ tile.fg }}"{% endif %}{% if tile.label %} title="{{ tile.label }}"{% endif %}>{% if tile.code %}{{ tile.code }}{% else %}<span class="ms" aria-hidden="true">{{ tile.icon }}</span>{% endif %}</span>{% endif %}
