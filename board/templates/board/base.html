{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Switchboard{% endblock %}</title>
<link rel="icon" href="{% static 'board/favicon.svg' %}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'board/board.css' %}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<div class="toasts" id="toasts" role="status" aria-live="polite">
{% for message in messages %}<div class="toast" data-toast><span class="ms fill" aria-hidden="true">{% if message.level_tag == 'error' %}error{% else %}info{% endif %}</span>{{ message }}</div>{% endfor %}
</div>
<script src="{% static 'board/ui.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
